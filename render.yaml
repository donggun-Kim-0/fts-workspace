# Render Blueprint — NestJS API + PostgreSQL
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: fts-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npx prisma db push && npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: fts-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        sync: false
      - key: ALLOW_VERCEL_PREVIEW
        value: 'true'

databases:
  - name: fts-db
    plan: free
    databaseName: fts_prod
    user: fts_user
